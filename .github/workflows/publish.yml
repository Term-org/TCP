name: Publish community packages

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "scripts/**"
      - "config.toml"
      - "keys/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  build:
    name: ${{ matrix.app_id }} / ${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        app_id:
          - app.term.one
          - app.term.two
          - app.term.three
          - app.term.four
        arch:
          - aarch64
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build packages
        env:
          TERMUX_PACKAGES_REF: ${{ needs.validate.outputs.ref }}
          PACKAGES: ${{ needs.validate.outputs.packages }}
        run: bash scripts/build-package.sh "${{ matrix.app_id }}" "${{ matrix.arch }}" $PACKAGES

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.app_id }}-${{ matrix.arch }}
          path: debs/${{ matrix.app_id }}/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.app_id }}-${{ matrix.arch }}
          path: work/*.log
          if-no-files-found: ignore
          retention-days: 7

  repo:
    name: Publish apt repositories
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout TCP
        uses: actions/checkout@v4

      - name: Checkout TP
        uses: actions/checkout@v4
        with:
          repository: Term-org/TP
          path: tp

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: debs-*

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg xz-utils gzip

      - name: Import signing key
        env:
          TERM_GPG_PRIVATE_KEY: ${{ secrets.TERM_COMMUNITY_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$TERM_GPG_PRIVATE_KEY" ]; then
            echo "The secret TERM_COMMUNITY_GPG_PRIVATE_KEY is not set" >&2
            exit 1
          fi
          printf '%s\n' "$TERM_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long

      - name: Build repositories
        env:
          TERM_PUBLIC_KEY: ${{ github.workspace }}/keys/term-community.gpg
          TERM_PUBLIC_KEY_NAME: term-community.gpg
          TERM_REPO_ORIGIN: Term Community
          TERM_REPO_LABEL: Term Community Packages
        run: bash tp/scripts/build-apt-repo.sh incoming site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
