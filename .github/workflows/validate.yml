name: Validate packages

on:
  pull_request:
    paths:
      - "packages/**"
      - "scripts/**"
      - "config.toml"
  workflow_call:
    outputs:
      ref:
        description: "termux-packages revision to build with"
        value: ${{ jobs.validate.outputs.ref }}
      packages:
        description: "Space separated list of package names"
        value: ${{ jobs.validate.outputs.packages }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate recipes
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.config.outputs.ref }}
      packages: ${{ steps.config.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read configuration
        id: config
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import tomllib

          with open("config.toml", "rb") as handle:
              config = tomllib.load(handle)

          names = sorted(
              entry for entry in os.listdir("packages")
              if os.path.isdir(os.path.join("packages", entry))
          )
          if not names:
              raise SystemExit("packages/ does not contain any package")
          print("ref=" + config.get("termux_packages_ref", "master"))
          print("packages=" + " ".join(names))
          PY

      - name: Fetch termux-packages
        env:
          REF: ${{ steps.config.outputs.ref }}
        run: |
          git init -q "$RUNNER_TEMP/termux-packages"
          git -C "$RUNNER_TEMP/termux-packages" remote add origin https://github.com/termux/termux-packages.git
          git -C "$RUNNER_TEMP/termux-packages" fetch -q --depth 1 origin "$REF"
          git -C "$RUNNER_TEMP/termux-packages" checkout -q FETCH_HEAD

      - name: Validate recipes
        env:
          TERMUX_PACKAGES_DIR: ${{ runner.temp }}/termux-packages
        run: bash scripts/validate-packages.sh